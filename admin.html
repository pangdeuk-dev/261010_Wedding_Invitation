<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RSVP 관리 종료</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: #f3f1ea;
      color: #15151a;
      font-family: "Noto Serif KR", Georgia, serif;
      font-weight: 300;
      line-height: 1.8;
    }
    main {
      width: min(100%, 420px);
      text-align: center;
      padding: 56px 24px;
      border-top: 1px solid rgba(21, 21, 26, 0.14);
      border-bottom: 1px solid rgba(21, 21, 26, 0.14);
    }
    h1 { font-weight: 400; font-size: 28px; line-height: 1.4; margin-bottom: 18px; }
    p { color: #6a6a72; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>참석 응답 관리가<br />종료되었습니다</h1>
    <p>예식이 끝나 관리자 페이지를 닫았습니다.<br />응답 목록은 더 이상 이 페이지에서 열리지 않습니다.</p>
  </main>
</body>
</html>
