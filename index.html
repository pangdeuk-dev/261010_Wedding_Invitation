<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="모바일 청첩장이 종료되었습니다." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="청첩장이 종료되었습니다" />
  <meta property="og:description" content="도광득 · 김서희 결혼식은 마무리되었습니다. 참석 회신도 마감되었습니다." />
  <title>청첩장이 종료되었습니다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3f1ea;
      --ink: #15151a;
      --muted: #6a6a72;
      --line: rgba(21, 21, 26, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif KR", Georgia, serif;
      font-weight: 300;
      line-height: 1.8;
    }
    main {
      width: min(100%, 420px);
      text-align: center;
      padding: 64px 28px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .kicker {
      font-family: Fraunces, Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 22px 0 28px;
      font-family: Fraunces, "Noto Serif KR", serif;
      font-weight: 400;
      font-size: 34px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .names {
      font-size: 16px;
    }
    .names span {
      font-family: Fraunces, serif;
      font-style: italic;
      padding: 0 6px;
    }
    .date {
      margin-top: 6px;
      color: var(--muted);
      letter-spacing: 0.12em;
      font-size: 13px;
    }
    .note {
      margin-top: 36px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Thank you</p>
    <h1>결혼식이<br />마무리되었습니다</h1>
    <p class="names">도광득 <span>&amp;</span> 김서희</p>
    <p class="date">2026. 10. 10</p>
    <p class="note">함께해 주신 모든 분들께 감사드립니다.<br />모바일 청첩장과 참석 회신은 종료되었습니다.</p>
  </main>
</body>
</html>
